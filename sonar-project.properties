# Completa estos dos valores con los datos del proyecto en SonarCloud.
# Configura SONAR_TOKEN como secreto de GitHub Actions.
sonar.projectKey=LauraArias56_administracion-empleados
sonar.organization=lauraarias56
sonar.sources=src,frontend/src
sonar.tests=test,api-tests/tests
sonar.test.inclusions=test/**/*.spec.ts,api-tests/tests/**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Vitest solo mide la cobertura de la API.
sonar.coverage.exclusions=frontend/src/**,src/config/**,src/services/interfaces/**,src/repositories/interfaces/**,src/dto/**,src/routes/**,src/main.ts,src/server.ts
sonar.sourceEncoding=UTF-8
